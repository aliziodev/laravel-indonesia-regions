name: Sync Upstream Data

on:
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Paksa sync walau hash source tidak berubah'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check source hash
        id: check
        env:
          FORCE_SYNC: ${{ github.event.inputs.force || 'false' }}
        run: |
          UPSTREAM_HASH=$(curl -sf \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/aliziodev/laravel-wilayah/commits/main" \
            | php -r '$data = json_decode(stream_get_contents(STDIN), true); echo $data["sha"] ?? "null";')

          CURRENT_HASH=$(php -r "
            \$v = @include 'data/version.php';
            echo \$v['source_hash'] ?? 'none';
          ")

          echo "upstream_hash=$UPSTREAM_HASH" >> $GITHUB_OUTPUT
          echo "current_hash=$CURRENT_HASH" >> $GITHUB_OUTPUT

          if [ "$UPSTREAM_HASH" = "null" ]; then
            echo "Gagal membaca hash source dari GitHub API."
            exit 1
          fi

          if [ "$FORCE_SYNC" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif [ "$UPSTREAM_HASH" != "$CURRENT_HASH" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ Indonesia Regions sudah up-to-date."
          fi

      - name: Set release metadata
        if: steps.check.outputs.changed == 'true'
        id: meta
        run: |
          cp data/version.php /tmp/regions-version-before.php 2>/dev/null || true
          echo "release_date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Sync PHP dataset from laravel-wilayah
        if: steps.check.outputs.changed == 'true'
        run: |
          php .github/scripts/sync_upstream_data.php https://github.com/aliziodev/laravel-wilayah.git main data

      # Commit upstream bisa berubah tanpa data wilayah ikut berubah (README, CI, refactor).
      # Gerbang sebenarnya ada di sini: bandingkan sidik jari isi dataset, bukan SHA commit.
      - name: Verifikasi isi dataset benar-benar berubah
        if: steps.check.outputs.changed == 'true'
        id: verify
        run: |
          OLD_DATA_HASH=$(php -r "
            \$v = @include '/tmp/regions-version-before.php';
            echo \$v['data_hash'] ?? 'none';
          ")
          NEW_DATA_HASH=$(php -r "
            \$v = @include 'data/version.php';
            echo \$v['data_hash'] ?? 'none';
          ")

          echo "old_data_hash=$OLD_DATA_HASH"
          echo "new_data_hash=$NEW_DATA_HASH"

          if [ "$NEW_DATA_HASH" = "none" ]; then
            echo "::error::Manifest baru tidak punya data_hash, sync dibatalkan."
            exit 1
          fi

          if [ "$OLD_DATA_HASH" = "$NEW_DATA_HASH" ]; then
            echo "⏭️ Commit upstream berubah tapi isi data wilayah identik. Tidak ada rilis."
            git checkout -- data
            git clean -fd data
            echo "data_changed=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Isi data wilayah berubah, lanjut rilis."
            echo "data_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        if: steps.verify.outputs.data_changed == 'true'
        id: version
        run: |
          CURRENT_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          CURRENT="${CURRENT_TAG#v}"

          if [ -z "$CURRENT" ] || [ "$CURRENT" = "$CURRENT_TAG" ]; then
            CURRENT="1.0.9"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "current_version=$CURRENT" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog and release notes
        if: steps.verify.outputs.data_changed == 'true'
        run: |
          php .github/scripts/generate_changelog.php \
            /tmp/regions-version-before.php \
            data/version.php \
            CHANGELOG.md \
            .github/release-notes.md \
            "${{ steps.version.outputs.current_version }}" \
            "${{ steps.version.outputs.new_version }}"

      - name: Commit and push
        if: steps.verify.outputs.data_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md data

          if git diff --cached --quiet; then
            echo "::error::Tidak ada perubahan untuk di-commit padahal data_hash berubah."
            exit 1
          fi

          git commit -m "data: sync indonesia regions $(date +%Y-%m-%d) [skip ci]

          Source: aliziodev/laravel-wilayah@${{ steps.check.outputs.upstream_hash }}"
          git push

      - name: Create GitHub release
        if: steps.verify.outputs.data_changed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: "v${{ steps.version.outputs.new_version }} - Sync ${{ steps.meta.outputs.release_date }}"
          body_path: .github/release-notes.md
          generate_release_notes: false
