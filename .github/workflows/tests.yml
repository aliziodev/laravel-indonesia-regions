name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '11.*'
            testbench: '^9.0'
            pest: '^3.8'
            pest_laravel: '^3.0'
          - php: '8.3'
            laravel: '12.*'
            testbench: '^10.0'
            pest: '^4.0'
            pest_laravel: '^4.0'
          - php: '8.4'
            laravel: '12.*'
            testbench: '^10.0'
            pest: '^4.0'
            pest_laravel: '^4.0'
          - php: '8.3'
            laravel: '13.*'
            testbench: '^11.0'
            pest: '^4.0'
            pest_laravel: '^4.0'
          - php: '8.4'
            laravel: '13.*'
            testbench: '^11.0'
            pest: '^4.0'
            pest_laravel: '^4.0'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev --no-update \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/database:${{ matrix.laravel }}" \
            "illuminate/routing:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "pestphp/pest:${{ matrix.pest }}" \
            "pestphp/pest-plugin-laravel:${{ matrix.pest_laravel }}"
          composer update --prefer-dist --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run tests
        run: vendor/bin/pest
